name: Deploy frontend to S3 + CloudFront (dev)

on:
  push:
    branches:
      - main
    paths:
      - "app/spotify_ui_frontend/**"
      - ".github/workflows/deploy-frontend-dev.yml"

permissions:
  id-token: write
  contents: read



jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/spotify_ui_frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/spotify_ui_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload hashed assets with long cache
        run: |
          aws s3 sync dist/assets s3://${{ vars.FRONTEND_BUCKET_NAME }}/assets \
            --delete \x
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload other static files with short cache
        run: |
          aws s3 sync dist s3://${{ vars.FRONTEND_BUCKET_NAME }} \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=300"

      - name: Upload index.html with no-cache
        run: |
          aws s3 cp dist/index.html s3://${{ vars.FRONTEND_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.FRONTEND_DISTRIBUTION_ID }}" \
            --paths "/*"