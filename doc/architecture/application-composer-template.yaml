AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Spotify App - architecture visualization template for AWS Application Composer.
  This file is intended to generate a complete service diagram and is not the
  production deployment source of truth.

Parameters:
  ProjectName:
    Type: String
    Default: spotify
  EnvironmentName:
    Type: String
    Default: dev
  FrontendDomainName:
    Type: String
    Default: app.example.com
  OpenSearchInstanceType:
    Type: String
    Default: t3.small.search

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        PROJECT_NAME: !Ref ProjectName
        ENVIRONMENT_NAME: !Ref EnvironmentName
        EVENT_BUS_NAME: !Ref SpotifyEventBus
        TRACKS_TABLE_NAME: !Ref TracksTable
        USERS_TABLE_NAME: !Ref UsersTable
        LISTENING_EVENTS_TABLE_NAME: !Ref ListeningEventsTable
        ANALYTICS_TABLE_NAME: !Ref AnalyticsTable
        MEDIA_BUCKET_NAME: !Ref MediaBucket
        OPENSEARCH_ENDPOINT: !GetAtt CatalogSearchDomain.DomainEndpoint

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${EnvironmentName}-frontend'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Spotify frontend delivery
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${EnvironmentName}-media'
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - GET
              - PUT
            AllowedOrigins:
              - !Sub 'https://${FrontendDomainName}'
            AllowedHeaders:
              - '*'

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Spotify media delivery
        Origins:
          - Id: MediaS3Origin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: MediaS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${EnvironmentName}-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${EnvironmentName}-web-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub 'https://${FrontendDomainName}/callback'
      LogoutURLs:
        - !Sub 'https://${FrontendDomainName}/logout'
      SupportedIdentityProviders:
        - COGNITO

  SpotifyHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowOrigins:
          - !Sub 'https://${FrontendDomainName}'
        AllowHeaders:
          - authorization
          - content-type

  SpotifyEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-bus'

  ListeningEventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-listening-events-dlq'

  ListeningEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-listening-events'
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ListeningEventsDLQ.Arn
        maxReceiveCount: 5

  TracksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-tracks'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ListeningEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-listening-events'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-analytics'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  CatalogSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub '${ProjectName}-${EnvironmentName}-catalog'
      EngineVersion: OpenSearch_2.11
      ClusterConfig:
        InstanceType: !Ref OpenSearchInstanceType
        InstanceCount: 1
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 20
        VolumeType: gp3
      EncryptionAtRestOptions:
        Enabled: true
      NodeToNodeEncryptionOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true

  ApiHealthcheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-healthcheck'
      CodeUri: ../../app/lambdas/api/healthcheck/
      Handler: handler.main
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: GET
            Path: /health

  ApiSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-search'
      CodeUri: ../../app/lambdas/api/search/
      Handler: handler.main
      Events:
        SearchRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: GET
            Path: /search

  ApiGetTracksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-get-tracks'
      CodeUri: ../../app/lambdas/api/get_tracks/
      Handler: handler.main
      Events:
        GetTracksRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: GET
            Path: /tracks

  ApiGetTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-get-track'
      CodeUri: ../../app/lambdas/api/get_track/
      Handler: handler.main
      Events:
        GetTrackRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: GET
            Path: /tracks/{trackId}

  ApiGetTrackStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-get-track-stats'
      CodeUri: ../../app/lambdas/api/get_track_stats/
      Handler: handler.main
      Events:
        GetTrackStatsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: GET
            Path: /tracks/{trackId}/stats

  ApiCreateTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-create-track'
      CodeUri: ../../app/lambdas/api/create_track/
      Handler: handler.main
      Events:
        CreateTrackRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: POST
            Path: /tracks

  ApiStartStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-start-stream'
      CodeUri: ../../app/lambdas/api/start_stream/
      Handler: handler.main
      Events:
        StartStreamRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: POST
            Path: /tracks/{trackId}/play

  ApiGetMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-get-me'
      CodeUri: ../../app/lambdas/api/get_me/
      Handler: handler.main
      Events:
        GetMeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: GET
            Path: /me

  ApiGetMeRecentlyPlayedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-get-me-recently-played'
      CodeUri: ../../app/lambdas/api/get_me_recently_played/
      Handler: handler.main
      Events:
        RecentlyPlayedRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: GET
            Path: /me/recently-played

  ApiGetMyHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-get-myhistory'
      CodeUri: ../../app/lambdas/api/get_myhistory/
      Handler: handler.main
      Events:
        ListeningHistoryRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: GET
            Path: /me/listening/history

  ApiGetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-get-user'
      CodeUri: ../../app/lambdas/api/get_user/
      Handler: handler.main

  ApiGetAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-get-analytics'
      CodeUri: ../../app/lambdas/api/get_analytics/
      Handler: handler.main
      Events:
        GetAnalyticsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpotifyHttpApi
            Method: GET
            Path: /analytics/global

  EventStoreListeningFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-event-store-listening-event'
      CodeUri: ../../app/lambdas/events/store_listening_event/
      Handler: handler.main
      Events:
        ListeningQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ListeningEventsQueue.Arn
            BatchSize: 10

  EventUpdateTrackStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-event-update-track-stats'
      CodeUri: ../../app/lambdas/events/update_track_stats/
      Handler: handler.main
      Events:
        ListeningQueueStatsEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ListeningEventsQueue.Arn
            BatchSize: 10

  EventProcessTrackUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-event-process-track-upload'
      CodeUri: ../../app/lambdas/events/process_track_upload/
      Handler: handler.main
      Events:
        MediaUploadCreated:
          Type: S3
          Properties:
            Bucket: !Ref MediaBucket
            Events:
              - s3:ObjectCreated:*

  EventPublishNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-event-publish-notifications'
      CodeUri: ../../app/lambdas/events/publish_notifications/
      Handler: handler.main

  OrchUpdateTrackStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-orch-update-track-stats'
      CodeUri: ../../app/lambdas/orchestration/update_track_stats/
      Handler: handler.main

  OrchUpdateUserStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-orch-update-user-stats'
      CodeUri: ../../app/lambdas/orchestration/update_user_stats/
      Handler: handler.main

  OrchComputeAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-orch-compute-analytics'
      CodeUri: ../../app/lambdas/orchestration/compute_analytics/
      Handler: handler.main

  TechReindexOpenSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-tech-reindex-opensearch'
      CodeUri: ../../app/lambdas/tech/reindex_opensearch/
      Handler: handler.main
      Events:
        TracksStreamEvent:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TracksTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10

  TechShowIndexOpenSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-tech-show-index-opensearch'
      CodeUri: ../../app/lambdas/tech/show_index_opensearch/
      Handler: handler.main

  TechIngestAudioMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-tech-ingest-audio-metadata'
      CodeUri: ../../app/lambdas/tech/ingest_audio_metadata/
      Handler: handler.main

  ListeningAnalyticsStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-listening-analytics'
      Type: STANDARD
      Tracing:
        Enabled: true
      Definition:
        Comment: Listening analytics orchestration
        StartAt: UpdateTrackStats
        States:
          UpdateTrackStats:
            Type: Task
            Resource: !GetAtt OrchUpdateTrackStatsFunction.Arn
            ResultPath: $.trackStatsResult
            Next: UpdateUserStats
          UpdateUserStats:
            Type: Task
            Resource: !GetAtt OrchUpdateUserStatsFunction.Arn
            ResultPath: $.userStatsResult
            Next: ComputeAnalytics
          ComputeAnalytics:
            Type: Task
            Resource: !GetAtt OrchComputeAnalyticsFunction.Arn
            ResultPath: $.analyticsResult
            End: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref OrchUpdateTrackStatsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref OrchUpdateUserStatsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref OrchComputeAnalyticsFunction

  TrackPlayedToQueueRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-track-played-to-sqs'
      EventBusName: !Ref SpotifyEventBus
      EventPattern:
        source:
          - spotify.api
        detail-type:
          - TrackPlayed
      Targets:
        - Arn: !GetAtt ListeningEventsQueue.Arn
          Id: ListeningEventsQueueTarget

  TrackPlayedToStateMachineRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-track-played-to-stepfn'
      EventBusName: !Ref SpotifyEventBus
      EventPattern:
        source:
          - spotify.api
        detail-type:
          - TrackPlayed
      Targets:
        - Arn: !Ref ListeningAnalyticsStateMachine
          Id: ListeningAnalyticsTarget
          RoleArn: !GetAtt EventBridgeToStepFunctionsRole.Arn

  EventBridgeToStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartListeningAnalyticsExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref ListeningAnalyticsStateMachine

Outputs:
  ApplicationComposerHint:
    Description: Open this file in AWS Application Composer to visualize the architecture.
    Value: AWS Application Composer visualization template ready
  HttpApiEndpoint:
    Description: HTTP API endpoint reference
    Value: !Sub 'https://${SpotifyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}'
  EventBusName:
    Description: Event bus name
    Value: !Ref SpotifyEventBus
  StateMachineArn:
    Description: Listening analytics state machine ARN
    Value: !Ref ListeningAnalyticsStateMachine
  SearchDomainEndpoint:
    Description: OpenSearch domain endpoint
    Value: !GetAtt CatalogSearchDomain.DomainEndpoint